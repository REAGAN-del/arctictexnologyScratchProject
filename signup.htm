<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style type="text/tailwindcss">
        @layer component {
        .container {
          @apply w-full mx-auto px-4 sm:px-10 md:px-20 lg:px-[180px];
        }
      }
    </style>
</head>

<body class="">
    <div class="">
        <img src="assets/Image (1).png" alt="background image " class="block md:hidden">


    </div>
    <div>
        <img src="assets/Image (2).png" alt="bggggg" class="hidden md:block lg:w-full md:h-230 lg:h-230">
    </div>

    <div
        class="flex flex-col lg:flex-row md:mt-35 lg:items-center lg:mt-16 lg:justify-center lg:gap-50 md:absolute md:top-90 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 lg:p-12 lg:rounded-2xl lg:border lg:border-gray-200  lg:shadow-xl lg:bg-[url('assets/bac.png')] lg:bg-cover lg:bg-center lg:bg-no-repeat">


        <div
            class="flex flex-col absolute md:static top-16 left-4 gap-6 md:gap-8 w-full items-start md:items-center lg:items-start lg:w-auto lg:shrink-0">
            <a href="onbording.htm"> <img src="assets/Logo (1).png" alt="logo" class="w-auto h-auto">
            </a>
            <h1 class="block lg:hidden text-[#030F09] text-[24px] font-bold pb-4">Start from scratch</h1>
        </div>


        <div class="w-full md:w-100 lg:w-[400px] md:border-0 md:rounded-lg md:bg-white lg:-m-12 lg:p-10 lg:w-80">
            <form action="submit" class="ml-3 md:p-8 lg:p-0">

                <h1 class="hidden lg:block text-[#030F09] text-[24px] font-bold">Start from scratch</h1>

                <label class="text-[14px] text-[#606060] mt-8 inline-block">Create account to continue</label><br><br>

                <label for="name" class="text-[#A8A8A8] text-[14px]">Full Name</label><br>
                <input type="text" placeholder="Nick Evans"
                    class="text-[#030F09] border-b border-[#CCCCCC] placeholder:text-[#030F09] my-4 w-full bg-transparent focus:outline-none">

                <label for="email" class="text-[#A8A8A8] text-[14px]">Email address</label><br>
                <input type="text" placeholder="user@email.com"
                    class="text-[#030F09] border-b border-[#CCCCCC] placeholder:text-[#030F09] my-4 w-full bg-transparent focus:outline-none">

                <div class="relative flex flex-row justify-between items-center mt-2">
                    <label for="password" class="text-[#A8A8A8] text-[14px]">Password</label>
                    <button type="button" class="text-[#30BE76] text-[14px]">Forgot password?</button>
                </div>

                <input type="password" placeholder=".........."
                    class="text-[#030F09] placeholder:font-bold placeholder:text-[20px] border-b border-[#CCCCCC] my-4 w-full placeholder:text-[#030F09] bg-transparent focus:outline-none"><br>

                <div class="flex justify-center items-center text-center mt-2">
                    <a href="login.htm">
                        <p class="border-0 py-2.5 px-6 rounded-md bg-[#30BE76] text-white w-full font-medium">Login</p>
                    </a>
                </div><br><br>

                <div class="text-center">
                    <p class="text-[#A8A8A8] text-[14px]">New to Scratch?</p>
                    <a href="signup.htm" class="text-[#30BE76] font-medium">Complete information and click login</a>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
